<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鲸语 WhaleTalk 控制台</title>
<link rel="stylesheet" href="/console/styles/base.css">
<link rel="stylesheet" href="/console/styles/cards.css">
<link rel="stylesheet" href="/console/styles/components.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="qq-bridge-mark" viewBox="0 0 800 800">
      <defs>
        <linearGradient id="qqbg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#4D6BFE"/><stop offset="50%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#22D3EE"/>
        </linearGradient>
        <linearGradient id="qqglow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="qqround"><rect width="800" height="800" rx="180" ry="180"/></clipPath>
      </defs>
      <g clip-path="url(#qqround)">
        <rect width="800" height="800" fill="url(#qqbg)"/>
        <rect width="800" height="420" fill="url(#qqglow)"/>
        <path d="M 190 545 C 190 372, 305 285, 400 285 C 495 285, 610 372, 610 545" fill="none" stroke="#FFFFFF" stroke-width="70" stroke-linecap="round"/>
        <rect x="150" y="536" width="500" height="72" rx="36" fill="#FFFFFF"/>
        <rect x="277" y="430" width="48" height="106" rx="24" fill="#FFFFFF"/>
        <rect x="376" y="360" width="48" height="176" rx="24" fill="#FFFFFF"/>
        <rect x="475" y="430" width="48" height="106" rx="24" fill="#FFFFFF"/>
        <g><rect x="96" y="626" width="152" height="84" rx="42" fill="#FFFFFF"/><path d="M 170 706 L 170 748 L 210 706 Z" fill="#FFFFFF"/><circle cx="146" cy="668" r="11" fill="#4D6BFE"/><circle cx="172" cy="668" r="11" fill="#4D6BFE"/><circle cx="198" cy="668" r="11" fill="#4D6BFE"/></g>
        <g><rect x="552" y="626" width="152" height="84" rx="42" fill="#FFFFFF"/><path d="M 630 706 L 590 706 L 630 748 Z" fill="#FFFFFF"/><circle cx="602" cy="668" r="11" fill="#22D3EE"/><circle cx="628" cy="668" r="11" fill="#22D3EE"/><circle cx="654" cy="668" r="11" fill="#22D3EE"/></g>
      </g>
    </symbol>
    <symbol id="ico-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="ico-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.2-7 4.1 14 2.2-7H21"/></symbol>
    <symbol id="ico-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    <symbol id="ico-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6l-7-3Z"/><path d="m9.5 12 1.8 1.8 3.2-3.6"/></symbol>
    <symbol id="ico-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/></symbol>
    <symbol id="ico-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></symbol>
    <symbol id="ico-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="ico-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></symbol>
  </svg>

  <!-- 动态氛围背景：纯装饰，不参与布局也不可交互 -->  <!-- 交互波浪：鼠标移动时线条会被推开（仿 SnowLuma 登录页） -->
  <div class="wave-field" aria-hidden="true"><canvas id="waveCanvas"></canvas></div>

  <div class="app-layout">
    <aside class="console-sidebar" id="consoleSidebar" aria-label="控制台导航">
      <div class="sidebar-brand">
        <svg class="sidebar-logo" aria-hidden="true"><use href="#qq-bridge-mark"></use></svg>
        <div class="sidebar-brand-text"><b>WhaleTalk</b><span>鲸语控制台</span></div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <button type="button" class="side-item active" data-group="core"><svg class="side-ico" aria-hidden="true"><use href="#ico-sliders"></use></svg><span class="side-text">基础功能</span><span class="side-count" id="sideCountCore">20</span></button>
        <button type="button" class="side-item" data-group="plugins"><svg class="side-ico" aria-hidden="true"><use href="#ico-pulse"></use></svg><span class="side-text">插件功能</span><span class="side-count" id="sideCountPlugins">0</span></button>
        <button type="button" class="side-item" data-group="plugin-manage"><svg class="side-ico" aria-hidden="true"><use href="#ico-shield"></use></svg><span class="side-text">插件管理</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button type="button" class="side-item" data-group="about"><svg class="side-ico" aria-hidden="true"><use href="#ico-info"></use></svg><span class="side-text">关于</span></button>
      </div>
      <div class="sidebar-foot"><span>WhaleTalk</span><span id="sidebarVersion">v0.7.1</span></div>
    </aside>
    <div class="app-main">
  <header class="topbar">
    <div>
      <h1>QQ 桥接控制台</h1>
      <div class="sub">DeepSeek Harness ↔ QQ 模式后台 · 修改即时生效（桥接 5 秒内感知）</div>
    </div>
    <div class="status-badge" id="statusText">加载中…</div>
  </header>

  <main class="console-shell">

  <div class="view-head" id="viewHead">
    <div>
      <h2 class="view-title" id="viewTitle">基础功能</h2>
      <div class="view-desc" id="viewDesc">桥接自带功能，按编号平铺；点击卡片进入整页设置。</div>
    </div>
  </div>

  <!-- 摘要卡网格：由 JS 依据下面的详情卡动态生成（无 JS 时仍显示原始长页面） -->
  <div class="summary-grid" id="summaryGrid" aria-label="功能摘要"></div>

  <!-- 插件功能：与基础功能相同的摘要卡布局；卡片数据只来自插件声明的元数据 -->
  <div id="pluginCategoryView" class="plugin-category-view" hidden>
    <div id="pluginSummaryGrid" class="summary-grid" aria-label="插件摘要"></div>
    <div id="pluginDetailPool" class="plugin-detail-pool" hidden></div>
  </div>

  <!-- 插件管理：独立页面，列出全部插件与加载/卸载按钮 -->
  <div id="pluginManageView" class="plugin-manage-view" hidden></div>

  <!-- ============ 关于页（侧栏进入，不占摘要卡） ============ -->
  <div id="aboutView" class="about-view" hidden></div>

  <!-- 详情卡容器：原有的 24 个 <section class="card"> 全部留在这里，
       JS 初始化时把本容器隐藏、把节点按需搬进整页视图。**节点是移动不是重建**，
       所以既有的 getElementById / 事件绑定 / 轮询写 DOM 全部照常工作。 -->
  <section class="grid" id="detailPool" aria-label="详情卡片容器">
  </section>
  <!-- /detailPool -->

  </main>
    </div>
  </div>

  <!-- ============ 卡片全页视图（点击摘要卡后展开） ============ -->
  <!-- 不是对话框：.detail-page 固定铺满视口，背景不透明，内容在正常文档流里滚动。
       点击摘要卡时用手写 ghost FLIP（.detail-ghost 白面做 transform 形变）展开到这一页；
       返回时反向形变。不用 View Transitions——整页快照太重，测试也禁用了该 API。 -->


  <!-- ============ 长期记忆详情（24 号卡「长期」按钮） ============ -->

<script>window.__CORE_SURFACE_ACTIVE__ = true; window.__APP_LAYOUT_ACTIVE__ = true;</script>
<script src="/console/app/runtime-common.js"></script>
<script src="/console/app/messages.js"></script>
<script src="/console/app/runtime-status.js"></script>
<script src="/console/app/runtime-summary.js"></script>
<script src="/console/app/runtime-devlog.js"></script>
<script src="/console/app/runtime-visuals.js"></script>
<script src="/console/app/runtime-boot.js"></script>
<script type="module" src="/console/shell.js"></script>
</body>
</html>
